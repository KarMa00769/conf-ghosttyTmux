# Dedicated configuration, loaded only by the ghostty-lab tmux server.
# Keep a POSIX shell for tmux's internal commands; interactive panes run zsh.
set -g default-shell /bin/zsh
set -g default-command 'exec /bin/zsh -l'
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 30000
set -g focus-events on
set -s set-clipboard on
set -g exit-empty on
set -g detach-on-destroy on
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

# Karma's lab-console style, using the Tokyo Night Storm palette.
set -g status-position top
set -g status-style 'bg=#1f2335,fg=#c0caf5'
set -g status-justify left
set -g status-interval 15
set -g status-left-length 72
set -g status-right-length 52
set -g status-left '#[fg=#7dcfff,bold] ◈ #[fg=#c0caf5,bold]#S #[fg=#565f89]│#[default]#{?#{==:#{client_key_table},mover}, #[fg=#e0af68]#[bold][WASD MOVER]#[default] ,#{?#{==:#{client_key_table},tamano}, #[fg=#e0af68]#[bold][WASD TAMAÑO]#[default] ,}} '
setw -g window-status-separator ' #[fg=#565f89]·#[default] '
setw -g window-status-format '#[fg=#565f89]#I #[fg=#a9b1d6]#{=20:window_name}#[default]'
setw -g window-status-current-format '#[fg=#e0af68,bold]› #I #[fg=#c0caf5,bold]#{=20:window_name}#{?window_zoomed_flag, +,}#[default]'
set -g status-right '#{?#{e|>=|:#{client_width},85},#[fg=#7dcfff]⌂ #[fg=#c0caf5]#{=20:#{b:pane_current_path}}#[fg=#565f89]  ·  #[fg=#e0af68]◷ #[fg=#c0caf5]%H:%M,}#{?#{e|<|:#{client_width},85},#[fg=#e0af68]◷ #[fg=#c0caf5]%H:%M,}#[default] '
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7dcfff'
set -g message-style 'bg=#1f2335,fg=#c0caf5'
set -g mode-style 'bg=#3b4261,fg=#c0caf5'

# Prefix Ctrl+B remains available, including when tmux is used on Linux.
bind c new-window -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind x kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind O select-pane -t ':.-'
bind s choose-tree -s
bind N command-prompt -p 'Nueva sesión:' 'new-session -s "%%"'
bind L select-layout tiled
bind r switch-client -T mover
bind R switch-client -T tamano

# Persistent WASD navigation table.
bind -T mover w select-pane -U \; switch-client -T mover
bind -T mover a select-pane -L \; switch-client -T mover
bind -T mover s select-pane -D \; switch-client -T mover
bind -T mover d select-pane -R \; switch-client -T mover
bind -T mover Escape switch-client -T root
bind -T mover Enter switch-client -T root
bind -T mover C-b switch-client -T prefix
bind -T mover Any switch-client -T mover

# Match Kitty: W grows height, S shrinks; A grows width, D shrinks.
bind -T tamano w run-shell -C 'resize-pane -t #{pane_id} -y #{e|+|:#{pane_height},1}' \; switch-client -T tamano
bind -T tamano s run-shell -C 'resize-pane -t #{pane_id} -y #{e|-|:#{pane_height},1}' \; switch-client -T tamano
bind -T tamano a run-shell -C 'resize-pane -t #{pane_id} -x #{e|+|:#{pane_width},1}' \; switch-client -T tamano
bind -T tamano d run-shell -C 'resize-pane -t #{pane_id} -x #{e|-|:#{pane_width},1}' \; switch-client -T tamano
bind -T tamano C-w run-shell -C 'resize-pane -t #{pane_id} -y #{e|+|:#{pane_height},2}' \; switch-client -T tamano
bind -T tamano C-s run-shell -C 'resize-pane -t #{pane_id} -y #{e|-|:#{pane_height},2}' \; switch-client -T tamano
bind -T tamano C-a run-shell -C 'resize-pane -t #{pane_id} -x #{e|+|:#{pane_width},2}' \; switch-client -T tamano
bind -T tamano C-d run-shell -C 'resize-pane -t #{pane_id} -x #{e|-|:#{pane_width},2}' \; switch-client -T tamano
bind -T tamano r select-layout tiled \; switch-client -T tamano
bind -T tamano Escape switch-client -T root
bind -T tamano Enter switch-client -T root
bind -T tamano C-b switch-client -T prefix
bind -T tamano Any switch-client -T tamano

# Scroll/search/copy uses tmux history rather than terminal redraw history.
setw -g mode-keys vi
bind / copy-mode \; send-keys -X search-backward
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy

# Searchable session picker, loaded directly without a plugin manager.
set -g @sessionx-bind 's'
set -g @sessionx-filter-current 'false'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '85%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '50%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-prompt 'Sesión > '
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-git-branch 'off'
set -g @sessionx-x-path '@HOME@'
run-shell '/usr/bin/env PATH=@BREW@/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin "@HOME@/.config/ghostty/plugins/tmux-sessionx/sessionx.tmux"'
# Preserve quoting for Home directories containing spaces.
bind s run-shell '"@HOME@/.config/ghostty/plugins/tmux-sessionx/scripts/sessionx.sh"'


# BEGIN KITTY-STYLE COMMAND KEYS
bind -n S-F1 split-window -h -c '#{pane_current_path}'
bind -T mover S-F1 switch-client -T root \; split-window -h -c '#{pane_current_path}'
bind -T tamano S-F1 switch-client -T root \; split-window -h -c '#{pane_current_path}'
bind -n S-F2 split-window -v -c '#{pane_current_path}'
bind -T mover S-F2 switch-client -T root \; split-window -v -c '#{pane_current_path}'
bind -T tamano S-F2 switch-client -T root \; split-window -v -c '#{pane_current_path}'
bind -n S-F3 kill-pane
bind -T mover S-F3 switch-client -T root \; kill-pane
bind -T tamano S-F3 switch-client -T root \; kill-pane
bind -n S-F4 resize-pane -Z
bind -T mover S-F4 switch-client -T root \; resize-pane -Z
bind -T tamano S-F4 switch-client -T root \; resize-pane -Z
bind -n S-F5 switch-client -T mover
bind -T mover S-F5 switch-client -T root
bind -T tamano S-F5 switch-client -T mover
bind -n S-F6 switch-client -T tamano
bind -T mover S-F6 switch-client -T tamano
bind -T tamano S-F6 switch-client -T root
bind -n S-F7 new-window -c '#{pane_current_path}'
bind -T mover S-F7 switch-client -T root \; new-window -c '#{pane_current_path}'
bind -T tamano S-F7 switch-client -T root \; new-window -c '#{pane_current_path}'
bind -n S-F8 previous-window
bind -T mover S-F8 switch-client -T root \; previous-window
bind -T tamano S-F8 switch-client -T root \; previous-window
bind -n S-F9 next-window
bind -T mover S-F9 switch-client -T root \; next-window
bind -T tamano S-F9 switch-client -T root \; next-window
bind -n S-F10 select-pane -L
bind -T mover S-F10 switch-client -T root \; select-pane -L
bind -T tamano S-F10 switch-client -T root \; select-pane -L
bind -n S-F11 select-pane -D
bind -T mover S-F11 switch-client -T root \; select-pane -D
bind -T tamano S-F11 switch-client -T root \; select-pane -D
bind -n S-F12 select-pane -U
bind -T mover S-F12 switch-client -T root \; select-pane -U
bind -T tamano S-F12 switch-client -T root \; select-pane -U
bind -n C-F1 select-pane -R
bind -T mover C-F1 switch-client -T root \; select-pane -R
bind -T tamano C-F1 switch-client -T root \; select-pane -R
bind -n C-F2 run-shell '"@HOME@/.config/ghostty/plugins/tmux-sessionx/scripts/sessionx.sh"'
bind -T mover C-F2 switch-client -T root \; run-shell '"@HOME@/.config/ghostty/plugins/tmux-sessionx/scripts/sessionx.sh"'
bind -T tamano C-F2 switch-client -T root \; run-shell '"@HOME@/.config/ghostty/plugins/tmux-sessionx/scripts/sessionx.sh"'
bind -n C-F3 command-prompt -I '#W' -p 'Nombre:' 'rename-window -- "%%"'
bind -T mover C-F3 switch-client -T root \; command-prompt -I '#W' -p 'Nombre:' 'rename-window -- "%%"'
bind -T tamano C-F3 switch-client -T root \; command-prompt -I '#W' -p 'Nombre:' 'rename-window -- "%%"'
bind -n C-F4 copy-mode \; send-keys -X search-backward
bind -T mover C-F4 switch-client -T root \; copy-mode \; send-keys -X search-backward
bind -T tamano C-F4 switch-client -T root \; copy-mode \; send-keys -X search-backward
bind -n C-F5 copy-mode
bind -T mover C-F5 switch-client -T root \; copy-mode
bind -T tamano C-F5 switch-client -T root \; copy-mode
bind -n C-F6 select-layout tiled
bind -T mover C-F6 switch-client -T root \; select-layout tiled
bind -T tamano C-F6 switch-client -T root \; select-layout tiled
bind -n C-F7 command-prompt -p 'Nueva sesión:' 'new-session -s "%%"'
bind -T mover C-F7 switch-client -T root \; command-prompt -p 'Nueva sesión:' 'new-session -s "%%"'
bind -T tamano C-F7 switch-client -T root \; command-prompt -p 'Nueva sesión:' 'new-session -s "%%"'
bind -n C-F8 select-window -t :1
bind -T mover C-F8 switch-client -T root \; select-window -t :1
bind -T tamano C-F8 switch-client -T root \; select-window -t :1
bind -n C-F9 select-window -t :2
bind -T mover C-F9 switch-client -T root \; select-window -t :2
bind -T tamano C-F9 switch-client -T root \; select-window -t :2
bind -n C-F10 select-window -t :3
bind -T mover C-F10 switch-client -T root \; select-window -t :3
bind -T tamano C-F10 switch-client -T root \; select-window -t :3
bind -n C-F11 select-window -t :4
bind -T mover C-F11 switch-client -T root \; select-window -t :4
bind -T tamano C-F11 switch-client -T root \; select-window -t :4
bind -n C-F12 select-window -t :5
bind -T mover C-F12 switch-client -T root \; select-window -t :5
bind -T tamano C-F12 switch-client -T root \; select-window -t :5
bind -n C-S-F1 select-window -t :6
bind -T mover C-S-F1 switch-client -T root \; select-window -t :6
bind -T tamano C-S-F1 switch-client -T root \; select-window -t :6
bind -n C-S-F2 select-window -t :7
bind -T mover C-S-F2 switch-client -T root \; select-window -t :7
bind -T tamano C-S-F2 switch-client -T root \; select-window -t :7
bind -n C-S-F3 select-window -t :8
bind -T mover C-S-F3 switch-client -T root \; select-window -t :8
bind -T tamano C-S-F3 switch-client -T root \; select-window -t :8
bind -n C-S-F4 select-window -t :9
bind -T mover C-S-F4 switch-client -T root \; select-window -t :9
bind -T tamano C-S-F4 switch-client -T root \; select-window -t :9
# END KITTY-STYLE COMMAND KEYS

# On-demand floating terminal. No automatic session or shell starts on config load.
set -g @floax-bind 'f'
set -g @floax-bind-menu 'P'
set -g @floax-width '80%'
set -g @floax-height '75%'
set -g @floax-border-color '#7dcfff'
set -g @floax-text-color '#c0caf5'
set -g @floax-title 'Terminal flotante · Ctrl+B f cerrar · Ctrl+B P menú'
set -g @floax-session-name 'flotante'
set -g @floax-change-path 'false'
run-shell '/usr/bin/env PATH=@BREW@/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin "@HOME@/.config/ghostty/plugins/tmux-floax/floax.tmux"'
# Keep Floax prefix bindings pointed at the actual scripts.
bind f run-shell '"@HOME@/.config/ghostty/plugins/tmux-floax/scripts/floax.sh"'
bind P run-shell '"@HOME@/.config/ghostty/plugins/tmux-floax/scripts/menu.sh"'

# Copy visible paths, addresses and identifiers through letter hints.
set -g @thumbs-key 'Space'
set -g @thumbs-command 'printf %s "{}" | /usr/bin/pbcopy; tmux set-buffer -- "{}"'
set -g @thumbs-upcase-command 'printf %s "{}" | /usr/bin/pbcopy; tmux set-buffer -- "{}"'
set -g @thumbs-multi-command 'printf %s "{}" | /usr/bin/pbcopy; tmux set-buffer -- "{}"'
set -g @thumbs-hint-fg-color 'magenta'
set -g @thumbs-unique enabled
# Direct binding avoids accumulating command aliases every time config is reloaded.
bind Space run-shell -b '"@HOME@/.config/ghostty/plugins/tmux-thumbs/tmux-thumbs.sh"'
bind -n C-S-F5 run-shell '"@HOME@/.config/ghostty/plugins/tmux-floax/scripts/floax.sh"'
bind -T mover C-S-F5 switch-client -T root \; run-shell '"@HOME@/.config/ghostty/plugins/tmux-floax/scripts/floax.sh"'
bind -T tamano C-S-F5 switch-client -T root \; run-shell '"@HOME@/.config/ghostty/plugins/tmux-floax/scripts/floax.sh"'
bind -n C-S-F6 run-shell -b '"@HOME@/.config/ghostty/plugins/tmux-thumbs/tmux-thumbs.sh"'
bind -T mover C-S-F6 switch-client -T root \; run-shell -b '"@HOME@/.config/ghostty/plugins/tmux-thumbs/tmux-thumbs.sh"'
bind -T tamano C-S-F6 switch-client -T root \; run-shell -b '"@HOME@/.config/ghostty/plugins/tmux-thumbs/tmux-thumbs.sh"'

# Manual snapshots; restore pane layouts without restarting programs.
set -g @resurrect-dir '@HOME@/.config/ghostty/data/resurrect'
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
run-shell '/usr/bin/env PATH=@BREW@/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin "@HOME@/.config/ghostty/plugins/tmux-resurrect/resurrect.tmux"'
